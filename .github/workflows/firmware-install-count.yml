name: Refresh USB install count

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firmware-install-count.yml'
      - '.github/scripts/refresh-firmware-install-count.mjs'
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: firmware-install-count

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/958373758002/locations/global/workloadIdentityPools/github-obi/providers/github
          service_account: obi-ga4-reader@mayday-obi-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Read GA4 install count
        run: node .github/scripts/refresh-firmware-install-count.mjs
        env:
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      - name: Publish aggregate if changed
        run: |
          git diff --quiet -- assets/firmware-install-count.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/firmware-install-count.json
          git commit -m 'Refresh USB install count'
          git push origin HEAD:main
