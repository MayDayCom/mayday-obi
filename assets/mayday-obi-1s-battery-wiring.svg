<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img" aria-labelledby="title desc"><title id="title">MAYDAY OBI 1셀 리튬이온 배터리 전원 및 GPIO9 전압 측정 연결도</title><desc id="desc">배터리를 가운데 두고 왼쪽에 전원 P5 플러스와 마이너스, 오른쪽에 GPIO9 측정 회로를 배치하였습니다. 배터리 플러스와 마이너스는 각각 P5 플러스와 마이너스에 연결합니다. 배터리 플러스에서 나온 별도 선은 100킬로옴 저항 R1을 거쳐 분압점에 연결합니다. 배터리 마이너스의 별도 선은 100킬로옴 저항 R2를 거쳐 같은 분압점에 연결합니다. 두 저항이 만나는 하나의 분압점에서 IO9에 연결합니다. IO14는 사용하지 않습니다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2031"/><stop offset="1" stop-color="#071323"/></linearGradient><linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1C4353"/><stop offset=".55" stop-color="#24595C"/><stop offset="1" stop-color="#153744"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0 H0 V30" stroke="#46637D" stroke-opacity=".10" fill="none"/></pattern></defs><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif}.b{font-weight:800}</style><rect width="1400" height="670" fill="url(#bg)"/><rect width="1400" height="670" fill="url(#grid)"/><text x="48" y="64" font-size="36" fill="#EFF7FC" class="b">리튬이온 배터리 연결</text><text x="48" y="102" font-size="20" fill="#AFC4D5" >배터리 가운데 · 왼쪽 P5 전원 · 오른쪽 IO9 전압 측정</text><rect x="35" y="154" width="352" height="394" rx="17" fill="#10263B" stroke="#31536A" stroke-width="2"/><rect x="904" y="154" width="458" height="394" rx="17" fill="#10263B" stroke="#31536A" stroke-width="2"/><text x="65" y="193" font-size="24" fill="#EFF7FC" class="b">P5 · 배터리 전원</text><text x="65" y="219" font-size="17" fill="#AFC4D5" >ESP32 보드 2핀 단자</text><text x="932" y="193" font-size="24" fill="#EFF7FC" class="b">P2 · 전압 측정</text><text x="932" y="219" font-size="17" fill="#AFC4D5" >100kΩ 저항 2개 · IO9 하나</text><rect x="63" y="247" width="266" height="76" rx="12" fill="#091B2C" stroke="#FF898E" stroke-width="2"/><text x="86" y="280" font-size="23" fill="#FF898E" class="b">P5 +</text><text x="86" y="307" font-size="18" fill="#AFC4D5" >BAT +</text><rect x="63" y="395" width="266" height="76" rx="12" fill="#091B2C" stroke="#C2CFD9" stroke-width="2"/><text x="86" y="427" font-size="23" fill="#C2CFD9" class="b">P5 −</text><text x="86" y="454" font-size="18" fill="#AFC4D5" >BAT −</text><rect x="565" y="235" width="249" height="280" rx="20" fill="url(#bat)" stroke="#47DEC9" stroke-width="2.5"/><rect x="657.13" y="219" width="64.74000000000001" height="18" rx="5" fill="#B9D8DD" stroke="#EAF7FA" stroke-width="1"/><rect x="577" y="247" width="225" height="61" rx="9" fill="#813D46" stroke="#FF898E" stroke-width="1"/><text x="689.5" y="287" font-size="37" fill="#EFF7FC" class="b" text-anchor="middle">+</text><text x="689.5" y="369.4" font-size="26" fill="#EFF7FC" class="b" text-anchor="middle">1셀 Li-ion</text><text x="689.5" y="405.79999999999995" font-size="21" fill="#AFC4D5" text-anchor="middle">3.7V / 1S</text><rect x="577" y="440" width="225" height="61" rx="9" fill="#172A3C" stroke="#C2CFD9" stroke-width="1"/><text x="689.5" y="486" font-size="42" fill="#EFF7FC" class="b" text-anchor="middle">−</text><path d="M329 285 H565" fill="none" stroke="#FF898E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M329 433 H565" fill="none" stroke="#C2CFD9" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="565" cy="285" r="7" fill="#FF898E" stroke="#071727" stroke-width="2"/><circle cx="565" cy="433" r="7" fill="#C2CFD9" stroke="#071727" stroke-width="2"/><path d="M814 285 H940" fill="none" stroke="#FF898E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M940 285 L951.5 272.0 L963.0 298.0 L974.5 272.0 L986.0 298.0 L997.5 272.0 L1009.0 298.0 L1020.5 272.0 L1032.0 285.0" fill="none" stroke="#F8C979" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 285 H1135 V359" fill="none" stroke="#45DDE9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M814 433 H940" fill="none" stroke="#C2CFD9" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M940 433 L951.5 420.0 L963.0 446.0 L974.5 420.0 L986.0 446.0 L997.5 420.0 L1009.0 446.0 L1020.5 420.0 L1032.0 433.0" fill="none" stroke="#F8C979" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 433 H1135 V359" fill="none" stroke="#45DDE9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1135" cy="359" r="9" fill="#45DDE9" stroke="#071727" stroke-width="2"/><path d="M1135 359 H1212" fill="none" stroke="#45DDE9" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="936" y="259" font-size="17" fill="#F8C979" class="b">R1 · 100kΩ</text><text x="936" y="474" font-size="17" fill="#F8C979" class="b">R2 · 100kΩ</text><text x="1114" y="335" font-size="15" fill="#45DDE9" text-anchor="end">분압점</text><rect x="1212" y="314" width="125" height="91" rx="12" fill="#091B2C" stroke="#45DDE9" stroke-width="2"/><text x="1274" y="352" font-size="27" fill="#45DDE9" class="b" text-anchor="middle">IO9</text><text x="1274" y="383" font-size="16" fill="#EFF7FC" text-anchor="middle">전압 측정</text><rect x="35" y="568" width="1327" height="76" rx="11" fill="#0B2B3E" stroke="#31536A" stroke-width="1.3"/><text x="57" y="597" font-size="18" fill="#EFF7FC" class="b">전원 2가닥 : 배터리 + → P5 +  /  배터리 − → P5 −</text><text x="57" y="625" font-size="18" fill="#47DEC9" class="b">측정 2가닥 : + → R1 100kΩ  /  − → R2 100kΩ  → 합쳐서 IO9</text><text x="1324" y="611" font-size="17" fill="#AFC4D5" text-anchor="end">IO14 미사용</text></svg>