<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1460" viewBox="0 0 760 1460" role="img" aria-labelledby="title description">
<title id="title">MAYDAY OBI — Makita LXT communication wiring</title>
<desc id="description">The yellow Makita LXT connector has seven communication pins. Main B− is a separate terminal to the left of pin 1. Connect GND to B−, IO5 to DATA pin 2, and IO6 to ENABLE pin 6. Board labels: P3 GND and 3.3V, P2 IO5 and IO6. Fit a 4.7kΩ pull-up between 3.3V and DATA. Never connect 18V B+ directly to ESP32.</desc>
