<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">MAYDAY OBI 1셀 리튬이온 배터리 전원 및 GPIO9 전압 측정 연결도</title><desc id="desc">배터리를 가운데 두고 왼쪽에 전원 P5 플러스와 마이너스, 오른쪽에 GPIO9 측정 회로를 배치하였습니다. 배터리 플러스와 마이너스는 각각 P5 플러스와 마이너스에 연결합니다. 배터리 플러스에서 나온 별도 선은 100킬로옴 저항 R1을 거쳐 분압점에 연결합니다. 배터리 마이너스의 별도 선은 100킬로옴 저항 R2를 거쳐 같은 분압점에 연결합니다. 두 저항이 만나는 하나의 분압점에서 IO9에 연결합니다. IO14는 사용하지 않습니다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2031"/><stop offset="1" stop-color="#071323"/></linearGradient><linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1C4353"/><stop offset=".55" stop-color="#24595C"/><stop offset="1" stop-color="#153744"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0 H0 V30" stroke="#46637D" stroke-opacity=".10" fill="none"/></pattern></defs><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif}.b{font-weight:800}</style><rect width="760" height="900" fill="url(#bg)"/><rect width="760" height="900" fill="url(#grid)"/><text x="26" y="53" font-size="30" fill="#EFF7FC" class="b">리튬이온 배터리 연결</text><text x="26" y="87" font-size="18" fill="#AFC4D5" >배터리 중앙 · 왼쪽 P5 · 오른쪽 IO9</text><rect x="18" y="174" width="209" height="438" rx="14" fill="#10263B" stroke="#31536A" stroke-width="2"/><rect x="483" y="174" width="260" height="438" rx="14" fill="#10263B" stroke="#31536A" stroke-width="2"/><text x="33" y="211" font-size="23" fill="#EFF7FC" class="b">P5 전원</text><text x="496" y="211" font-size="21" fill="#EFF7FC" class="b">전압 측정</text><text x="496" y="237" font-size="16" fill="#AFC4D5" >IO9</text><rect x="33" y="262" width="176" height="74" rx="10" fill="#091B2C" stroke="#FF898E" stroke-width="2"/><text x="46" y="290" font-size="22" fill="#FF898E" class="b">P5 +</text><text x="46" y="317" font-size="15" fill="#EFF7FC" >전원 플러스</text><rect x="33" y="418" width="176" height="74" rx="10" fill="#091B2C" stroke="#C2CFD9" stroke-width="2"/><text x="46" y="446" font-size="22" fill="#C2CFD9" class="b">P5 −</text><text x="46" y="473" font-size="15" fill="#EFF7FC" >전원 마이너스</text><rect x="277" y="233" width="174" height="316" rx="20" fill="url(#bat)" stroke="#47DEC9" stroke-width="2.5"/><rect x="341.38" y="217" width="45.24" height="18" rx="5" fill="#B9D8DD" stroke="#EAF7FA" stroke-width="1"/><rect x="289" y="245" width="150" height="61" rx="9" fill="#813D46" stroke="#FF898E" stroke-width="1"/><text x="364" y="285" font-size="33" fill="#EFF7FC" class="b" text-anchor="middle">+</text><text x="364" y="384.68" font-size="22" fill="#EFF7FC" class="b" text-anchor="middle">1셀 Li-ion</text><text x="364" y="425.76" font-size="17" fill="#AFC4D5" text-anchor="middle">3.7V / 1S</text><rect x="289" y="474" width="150" height="61" rx="9" fill="#172A3C" stroke="#C2CFD9" stroke-width="1"/><text x="364" y="520" font-size="38" fill="#EFF7FC" class="b" text-anchor="middle">−</text><path d="M209 297 H277" fill="none" stroke="#FF898E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M209 453 H277" fill="none" stroke="#C2CFD9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="277" cy="297" r="6" fill="#FF898E" stroke="#071727" stroke-width="2"/><circle cx="277" cy="453" r="6" fill="#C2CFD9" stroke="#071727" stroke-width="2"/><path d="M451 297 H503" fill="none" stroke="#FF898E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M503 297 L510.1 284.0 L517.3 310.0 L524.4 284.0 L531.5 310.0 L538.6 284.0 L545.8 310.0 L552.9 284.0 L560.0 297.0" fill="none" stroke="#F8C979" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M560 297 H601 V374" fill="none" stroke="#45DDE9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M451 453 H503" fill="none" stroke="#C2CFD9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M503 453 L510.1 440.0 L517.3 466.0 L524.4 440.0 L531.5 466.0 L538.6 440.0 L545.8 466.0 L552.9 440.0 L560.0 453.0" fill="none" stroke="#F8C979" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M560 453 H601 V374" fill="none" stroke="#45DDE9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="601" cy="374" r="7" fill="#45DDE9" stroke="#071727" stroke-width="2"/><path d="M601 374 H635" fill="none" stroke="#45DDE9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="490" y="276" font-size="15" fill="#F8C979" class="b">R1 100kΩ</text><text x="490" y="494" font-size="15" fill="#F8C979" class="b">R2 100kΩ</text><text x="595" y="355" font-size="13" fill="#45DDE9" text-anchor="end">합류</text><rect x="635" y="337" width="96" height="76" rx="10" fill="#091B2C" stroke="#45DDE9" stroke-width="2"/><text x="683" y="367" font-size="25" fill="#45DDE9" class="b" text-anchor="middle">IO9</text><text x="683" y="393" font-size="16" fill="#EFF7FC" text-anchor="middle">측정</text><rect x="18" y="638" width="724" height="165" rx="14" fill="#0B2B3E" stroke="#31536A" stroke-width="1.5"/><text x="39" y="675" font-size="21" fill="#EFF7FC" class="b">전원선 2개</text><text x="39" y="708" font-size="18" fill="#AFC4D5" >배터리 + → P5 +   /   배터리 − → P5 −</text><text x="39" y="750" font-size="21" fill="#47DEC9" class="b">측정선 2개</text><text x="39" y="780" font-size="18" fill="#EFF7FC" >저항 100kΩ 두 개를 합쳐서 IO9 연결</text><text x="32" y="859" font-size="17" fill="#AFC4D5" >IO14 연결하지 않음 · 보호회로 내장 1셀(1S) 사용</text></svg>