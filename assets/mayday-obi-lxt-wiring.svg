<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="wiring-title wiring-desc">
<title id="wiring-title">MAYDAY OBI 마끼다 LXT 실물 단자 위치 표시 배선도</title>
<desc id="wiring-desc">마끼다 LXT 배터리 노란색 통신 커넥터, B- 주음극 기준 방향에서 2번 DATA, 6번 ENABLE 접점 강조. ESP32-S3 GPIO5 DATA, GPIO6 ENABLE은 기존 개발 설정의 예시이며 검증 필요. 배터리 주 음극과 ESP32 GND 연결 및 3.3V와 DATA 간 4.7킬로옴 풀업 저항. 18V B+는 절대 ESP32에 연결하지 마세요. 커넥터 방향과 펌웨어 핀 번호는 실물 확인 후 사용하세요.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Nanum Gothic',sans-serif} .strong{font-weight:750} .small{font-weight:500}</style>
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#081c2b" stroke="#081c2b" stroke-width="0"/>

<text x="60" y="62" font-size="39" fill="#eaf5ff" class="strong">MAYDAY OBI</text>
<text x="345" y="62" font-size="34" fill="#eaf5ff" class="strong">마끼다 LXT 통신 단자 연결</text>
<text x="60" y="96" font-size="18" fill="#adc4d5" >노란색 7접점 커넥터: 2번 DATA / 6번 ENABLE · 주 음극 B−는 별도 단자</text>
