<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">MAYDAY OBI 3.5인치 ESP32-S3와 마끼다 LXT 배터리 연결 참고도</title>
<desc id="diagramDescription">JC3248W535 P2 8핀 확장단자 Pin1 GPIO5는 배터리 데이터, Pin2 GPIO6은 Enable, P3 Pin1 GND는 배터리 B 마이너스에 연결. P3 Pin2 3.3볼트는 4.7킬로옴 풀업 저항을 통하여 데이터 신호에 연결. 배터리 B 플러스 18볼트는 ESP32 연결 금지. 신호핀의 실제 위치와 최신 펌웨어는 연결 전에 확인 필요.</desc>
