<circle cx="92" cy="866" r="6" fill="#42decf"/><text x="113" y="874">KST 2.8인치와 다른 보드입니다. KST GPIO2/3 배선을 3.5인치에 그대로 적용하지 마세요.</text>
<circle cx="92" cy="903" r="6" fill="#ff9f81"/><text x="113" y="911">배터리/어댑터 방향에 따라 통신 단자 번호가 반대로 보일 수 있습니다. 실물 핀과 공통 GND를 확인하세요.</text></g>
