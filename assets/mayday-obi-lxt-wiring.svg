<text x="340" y="65" font-size="34" fill="#e9f5ff" >배선 연결 안내</text>
<text x="68" y="100" font-size="18" fill="#9eb4c5" >ESP32-S3 3.5인치 ↔ Makita LXT 통신선  |  예시 배선 · 실물 핀 방향 확인 필수</text>
