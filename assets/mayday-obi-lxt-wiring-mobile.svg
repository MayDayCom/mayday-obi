<text x="32" y="99" font-size="27" fill="#eaf5ff" class="b">마끼다 LXT 통신 단자 연결</text>
<text x="32" y="131" font-size="17" fill="#acc3d5" >B− 주 음극은 1번 접점 왼쪽에 별도 표시</text>
