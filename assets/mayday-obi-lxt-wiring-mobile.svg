<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="wiring-title wiring-desc">
<title id="wiring-title">MAYDAY OBI 마끼다 LXT 통신단자 2번과 6번 배선 안내</title>
<desc id="wiring-desc">마끼다 LXT 배터리 노란색 통신 커넥터, B- 주음극 기준 방향에서 2번 DATA, 6번 ENABLE 접점 강조. ESP32-S3 GPIO5 DATA, GPIO6 ENABLE은 기존 개발 설정의 예시이며 검증 필요. 배터리 주 음극과 ESP32 GND 연결 및 3.3V와 DATA 간 4.7킬로옴 풀업 저항. 18V B+는 절대 ESP32에 연결하지 마세요. 커넥터 방향과 펌웨어 핀 번호는 실물 확인 후 사용하세요.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Nanum Gothic',sans-serif} .strong{font-weight:750} .small{font-weight:500}</style>
