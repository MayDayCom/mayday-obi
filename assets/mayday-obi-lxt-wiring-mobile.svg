<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1410" viewBox="0 0 760 1410" role="img" aria-labelledby="title description">
<title id="title">MAYDAY OBI — 마끼다 LXT 통신 단자 2번 DATA, 6번 ENABLE, 왼쪽 B− 연결도</title>
<desc id="description">마끼다 LXT 노란색 7접점 통신 커넥터의 왼쪽 1번 접점 바로 왼쪽에 별도 B− 주 음극 단자를 배치했습니다. 2번은 DATA, 6번은 ENABLE. ESP32 GND는 B−에, GPIO5는 DATA에, GPIO6은 ENABLE에 연결하는 기존 메이데이 코드 참고도이며 실제 전기적 호환성 확인이 필요합니다. 3.3V와 DATA 사이 4.7k옴 풀업 저항. B+ 18V 직접 연결 절대 금지.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Nanum Gothic',sans-serif}.b{font-weight:750}</style>
